<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mario Game - 100 Levels</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #gameWrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 1200px;
            max-height: 800px;
            aspect-ratio: 3/2;
        }

        #gameContainer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 100%);
            border: 4px solid #333;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui {
            position: absolute;
            top: 12px;
            left: 12px;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 16px;
            border-radius: 6px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            min-width: 150px;
        }

        #ui div {
            margin: 4px 0;
            line-height: 1.4;
        }

        #levelInfo {
            position: absolute;
            top: 12px;
            right: 12px;
            color: #fff;
            font-size: 13px;
            font-weight: bold;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 16px;
            border-radius: 6px;
            text-align: right;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            min-width: 140px;
        }

        #gameOver {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            color: white;
            padding: 40px 50px;
            border-radius: 15px;
            text-align: center;
            display: none;
            z-index: 300;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            min-width: 380px;
            max-width: 90vw;
        }

        #gameOverText {
            font-size: 42px;
            margin-bottom: 20px;
            font-weight: bold;
            color: #FFD700;
        }

        #gameOverStats {
            font-size: 16px;
            margin: 15px 0;
            color: #fff;
            line-height: 1.6;
        }

        #gameOver button {
            margin-top: 25px;
            margin-right: 10px;
            padding: 11px 28px;
            font-size: 15px;
            background: #FF6B6B;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        #gameOver button:hover {
            background: #FF5252;
            transform: scale(1.05);
        }

        .instructions {
            position: absolute;
            bottom: 12px;
            left: 12px;
            color: #fff;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 12px;
            border-radius: 6px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            line-height: 1.5;
        }

        #progressBar {
            position: absolute;
            bottom: 12px;
            right: 12px;
            width: 180px;
            height: 18px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 9px;
            overflow: hidden;
            border: 2px solid #FFD700;
        }

        #progressFill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            width: 0%;
            transition: width 0.3s ease;
        }

        #progressText {
            position: absolute;
            bottom: 14px;
            right: 195px;
            color: #fff;
            font-size: 11px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        @media (max-width: 768px) {
            #ui, #levelInfo {
                font-size: 12px;
                padding: 10px 12px;
            }

            #gameOverText {
                font-size: 32px;
            }

            #gameOver {
                min-width: 85vw;
                padding: 30px 25px;
            }
        }
    </style>
</head>
<body>
    <div id="gameWrapper">
        <div id="gameContainer">
            <canvas id="gameCanvas"></canvas>
            <div id="ui">
                <div>Score: <span id="score">0</span></div>
                <div>Lives: <span id="lives">5</span></div>
                <div>Coins: <span id="coins">0</span>/<span id="coinsTotal">0</span></div>
                <div>Fireballs: <span id="fireballs">0</span></div>
            </div>
            <div id="levelInfo">
                <div>Level: <span id="level">1</span>/100</div>
                <div>Best: <span id="bestScore">0</span></div>
            </div>
            <div id="gameOver">
                <div id="gameOverText">Game Over!</div>
                <div id="gameOverStats"></div>
                <button onclick="location.reload()">Play Again</button>
                <button onclick="window.close()">Exit</button>
            </div>
            <div class="instructions">W/A/S/D Move | SPACE Jump | F Fire | Defeat Enemies | Collect Coins</div>
            <div id="progressText"><span id="progressPercent">0</span>%</div>
            <div id="progressBar">
                <div id="progressFill"></div>
            </div>
        </div>
    </div>

    <script>
        // Initialize canvas with proper sizing
        const gameWrapper = document.getElementById('gameWrapper');
        const gameContainer = document.getElementById('gameContainer');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { antialias: true });

        function resizeCanvas() {
            const rect = gameContainer.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Game states
        const gameState = {
            score: 0,
            bestScore: parseInt(localStorage.getItem('bestScore')) || 0,
            level: 1,
            lives: 5,
            gameOver: false,
            won: false,
            coinsCollected: 0,
            coinsTotal: 0,
            fireballs: 0
        };

        // Player object
        const player = {
            x: 50,
            y: 0,
            width: 30,
            height: 40,
            velocityY: 0,
            velocityX: 0,
            speed: 5.5,
            jumpPower: 14,
            isJumping: false,
            direction: 1,
            color: '#FF0000',
            animationFrame: 0,
            canDoubleJump: false,
            doubleJumpUsed: false
        };

        // Input handling
        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            
            if (e.key === ' ') {
                e.preventDefault();
                if (!player.isJumping) {
                    player.velocityY = -player.jumpPower;
                    player.isJumping = true;
                    player.doubleJumpUsed = false;
                } else if (player.canDoubleJump && !player.doubleJumpUsed) {
                    player.velocityY = -player.jumpPower * 0.75;
                    player.doubleJumpUsed = true;
                }
            }
            
            if (e.key.toLowerCase() === 'f') {
                e.preventDefault();
                fireFireball();
            }
        });
        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        let platforms = [];
        let enemies = [];
        let coins = [];
        let particles = [];
        let fireballs = [];

        // Particle system
        class Particle {
            constructor(x, y, vx, vy, color) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.color = color;
                this.life = 1;
                this.decay = 0.02;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.3;
                this.life -= this.decay;
            }

            draw(ctx) {
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.life;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        // Fireball class
        class Fireball {
            constructor(x, y, direction) {
                this.x = x;
                this.y = y;
                this.width = 12;
                this.height = 12;
                this.speed = 8;
                this.direction = direction;
                this.rotation = 0;
                this.life = 300;
            }

            update() {
                this.x += this.speed * this.direction;
                this.rotation += 0.2;
                this.life--;

                // Check enemy collisions
                for (let i = enemies.length - 1; i >= 0; i--) {
                    const enemy = enemies[i];
                    if (
                        this.x < enemy.x + enemy.width &&
                        this.x + this.width > enemy.x &&
                        this.y < enemy.y + enemy.height &&
                        this.y + this.height > enemy.y
                    ) {
                        createParticles(this.x, this.y, '#FF6B00', 15);
                        enemies.splice(i, 1);
                        gameState.score += 300;
                        return false;
                    }
                }

                return this.life > 0 && this.x > -50 && this.x < canvas.width + 50;
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                // Fireball glow
                ctx.fillStyle = 'rgba(255, 107, 0, 0.3)';
                ctx.beginPath();
                ctx.arc(0, 0, this.width, 0, Math.PI * 2);
                ctx.fill();

                // Fireball
                ctx.fillStyle = '#FF6B00';
                ctx.beginPath();
                ctx.arc(0, 0, this.width / 2, 0, Math.PI * 2);
                ctx.fill();

                // Highlight
                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.arc(-2, -2, 2, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        function fireFireball() {
            if (gameState.fireballs < 5) {
                fireballs.push(new Fireball(player.x + player.width / 2, player.y + player.height / 2, player.direction));
                gameState.fireballs++;
            }
        }

        function createParticles(x, y, color, count = 8) {
            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 * i) / count;
                const vx = Math.cos(angle) * 4;
                const vy = Math.sin(angle) * 4;
                particles.push(new Particle(x, y, vx, vy, color));
            }
        }

        function generateLevel(levelNum) {
            platforms = [];
            enemies = [];
            coins = [];
            particles = [];
            fireballs = [];

            const w = canvas.width;
            const h = canvas.height;

            // Ground
            platforms.push({ 
                x: 0, 
                y: h - 50, 
                width: w, 
                height: 50, 
                color: '#8B4513', 
                moving: false 
            });

            const difficulty = Math.min(levelNum / 15, 6);
            const platformCount = 7 + Math.floor(difficulty * 5);
            const enemyCount = Math.max(1, Math.floor(difficulty * 2.5));
            const coinCount = 4 + Math.floor(difficulty * 4);

            // Generate platforms
            for (let i = 1; i < platformCount; i++) {
                const y = h - 100 - (i * (h - 150) / platformCount);
                const x = Math.random() * (w - 100);
                const width = 70 + Math.random() * 90;
                const isMoving = Math.random() < 0.15 + (difficulty * 0.05);
                const moveRange = 80 + difficulty * 60;

                platforms.push({
                    x: x,
                    y: y,
                    width: width,
                    height: 18,
                    color: '#228B22',
                    moving: isMoving,
                    moveRange: moveRange,
                    moveSpeed: 1 + difficulty * 0.6,
                    originalX: x,
                    direction: Math.random() > 0.5 ? 1 : -1
                });
            }

            // Generate enemies
            for (let i = 0; i < enemyCount; i++) {
                const platformIndex = Math.floor(Math.random() * (platforms.length - 1)) + 1;
                const platform = platforms[platformIndex];
                enemies.push({
                    x: platform.x + platform.width / 2,
                    y: platform.y - 35,
                    width: 32,
                    height: 32,
                    speed: 1.8 + difficulty * 0.6,
                    direction: Math.random() > 0.5 ? 1 : -1,
                    color: '#FF8C00',
                    health: 1
                });
            }

            // Generate coins
            for (let i = 0; i < coinCount; i++) {
                const platformIndex = Math.floor(Math.random() * (platforms.length - 1)) + 1;
                const platform = platforms[platformIndex];
                coins.push({
                    x: platform.x + Math.random() * (platform.width - 20),
                    y: platform.y - 28,
                    width: 14,
                    height: 14,
                    collected: false,
                    rotation: 0,
                    bob: Math.random() * Math.PI * 2
                });
            }

            gameState.coinsTotal = coins.length;
            gameState.coinsCollected = 0;
            gameState.fireballs = 0;
            player.canDoubleJump = levelNum >= 15;
            player.y = h - 120;
        }

        function updatePlayer() {
            const w = canvas.width;
            const h = canvas.height;

            if (keys['w']) {
                // W for up (jump alternative)
            } else if (keys['a']) {
                player.velocityX = -player.speed;
                player.direction = -1;
            } else if (keys['d']) {
                player.velocityX = player.speed;
                player.direction = 1;
            } else if (keys['s']) {
                // S for down (crouch alternative)
            } else {
                player.velocityX *= 0.85;
            }

            player.x += player.velocityX;

            if (player.x < -40) player.x = w;
            if (player.x > w) player.x = -40;

            player.velocityY += 0.65;
            player.y += player.velocityY;

            player.isJumping = true;
            for (let platform of platforms) {
                if (
                    player.velocityY >= 0 &&
                    player.y + player.height >= platform.y &&
                    player.y + player.height <= platform.y + platform.height + 12 &&
                    player.x + player.width > platform.x &&
                    player.x < platform.x + platform.width
                ) {
                    player.velocityY = 0;
                    player.y = platform.y - player.height;
                    player.isJumping = false;
                }
            }

            if (player.y > h) {
                gameState.lives--;
                if (gameState.lives <= 0) {
                    gameState.gameOver = true;
                } else {
                    resetPlayerPosition();
                }
            }

            player.animationFrame = (player.animationFrame + 1) % 8;
        }

        function updatePlatforms() {
            for (let platform of platforms) {
                if (platform.moving) {
                    platform.x += platform.moveSpeed * platform.direction;
                    if (Math.abs(platform.x - platform.originalX) > platform.moveRange) {
                        platform.direction *= -1;
                    }
                }
            }
        }

        function updateEnemies() {
            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                const w = canvas.width;

                enemy.x += enemy.speed * enemy.direction;

                if (enemy.x < 0 || enemy.x + enemy.width > w) {
                    enemy.direction *= -1;
                }

                if (
                    player.x < enemy.x + enemy.width &&
                    player.x + player.width > enemy.x &&
                    player.y < enemy.y + enemy.height &&
                    player.y + player.height > enemy.y
                ) {
                    if (player.velocityY > 0 && player.y + player.height - player.velocityY <= enemy.y) {
                        createParticles(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, '#FF8C00', 12);
                        enemies.splice(i, 1);
                        gameState.score += 200;
                        player.velocityY = -player.jumpPower * 0.85;
                    } else {
                        gameState.lives--;
                        if (gameState.lives <= 0) {
                            gameState.gameOver = true;
                        } else {
                            resetPlayerPosition();
                        }
                    }
                }
            }
        }

        function updateCoins() {
            for (let coin of coins) {
                coin.rotation += 0.08;
                coin.bob += 0.05;

                if (!coin.collected &&
                    player.x < coin.x + coin.width &&
                    player.x + player.width > coin.x &&
                    player.y < coin.y + coin.height &&
                    player.y + player.height > coin.y
                ) {
                    coin.collected = true;
                    gameState.coinsCollected++;
                    gameState.score += 50;
                    createParticles(coin.x + coin.width / 2, coin.y + coin.height / 2, '#FFD700', 10);
                }
            }

            if (gameState.coinsCollected === gameState.coinsTotal && gameState.coinsTotal > 0) {
                gameState.level++;
                if (gameState.level > 100) {
                    gameState.won = true;
                    gameState.gameOver = true;
                } else {
                    generateLevel(gameState.level);
                    resetPlayerPosition();
                }
            }
        }

        function updateFireballs() {
            for (let i = fireballs.length - 1; i >= 0; i--) {
                if (!fireballs[i].update()) {
                    fireballs.splice(i, 1);
                    gameState.fireballs--;
                }
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function resetPlayerPosition() {
            player.x = 50;
            player.y = canvas.height - 120;
            player.velocityY = 0;
            player.velocityX = 0;
            player.doubleJumpUsed = false;
        }

        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x + player.width / 2, player.y + player.height / 2);
            if (player.direction === -1) {
                ctx.scale(-1, 1);
            }
            ctx.translate(-(player.width / 2), -(player.height / 2));

            // Body
            ctx.fillStyle = player.color;
            ctx.fillRect(0, 10, player.width, player.height - 10);
            ctx.fillRect(2, 15, 8, 15);
            ctx.fillRect(player.width - 10, 15, 8, 15);

            // Head
            ctx.beginPath();
            ctx.arc(player.width / 2, 8, 9, 0, Math.PI * 2);
            ctx.fill();

            // Eyes
            ctx.fillStyle = 'white';
            ctx.fillRect(player.width / 2 - 7, 4, 4, 4);
            ctx.fillRect(player.width / 2 + 3, 4, 4, 4);

            // Pupils
            ctx.fillStyle = 'black';
            const pupilOffset = Math.sin(player.animationFrame * 0.4) * 1;
            ctx.fillRect(player.width / 2 - 6 + pupilOffset, 5, 2, 2);
            ctx.fillRect(player.width / 2 + 4 + pupilOffset, 5, 2, 2);

            // Mouth
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(player.width / 2, 11, 4, 0, Math.PI);
            ctx.stroke();

            ctx.restore();
        }

        function drawPlatforms() {
            for (let platform of platforms) {
                // Shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
                ctx.fillRect(platform.x + 2, platform.y + 2, platform.width, platform.height);

                // Platform
                ctx.fillStyle = platform.color;
                ctx.fillRect(platform.x, platform.y, platform.width, platform.height);

                // Border
                ctx.strokeStyle = '#1a4d1a';
                ctx.lineWidth = 2;
                ctx.strokeRect(platform.x, platform.y, platform.width, platform.height);

                // Highlight
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(platform.x + 2, platform.y + 2);
                ctx.lineTo(platform.x + platform.width - 2, platform.y + 2);
                ctx.stroke();
            }
        }

        function drawEnemies() {
            for (let enemy of enemies) {
                // Shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
                ctx.fillRect(enemy.x + 1, enemy.y + enemy.height - 2, enemy.width, 3);

                // Body
                ctx.fillStyle = enemy.color;
                ctx.beginPath();
                ctx.arc(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, enemy.width / 2, 0, Math.PI * 2);
                ctx.fill();

                // Border
                ctx.strokeStyle = '#CC6600';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Eyes
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(enemy.x + 9, enemy.y + 9, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(enemy.x + 23, enemy.y + 9, 4, 0, Math.PI * 2);
                ctx.fill();

                // Pupils
                ctx.fillStyle = 'black';
                ctx.beginPath();
                ctx.arc(enemy.x + 9 + enemy.direction * 1.5, enemy.y + 9, 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(enemy.x + 23 + enemy.direction * 1.5, enemy.y + 9, 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawCoins() {
            for (let coin of coins) {
                if (!coin.collected) {
                    ctx.save();
                    ctx.translate(coin.x + coin.width / 2, coin.y + coin.height / 2 + Math.sin(coin.bob) * 2);
                    ctx.rotate(coin.rotation);

                    // Coin
                    ctx.fillStyle = '#FFD700';
                    ctx.beginPath();
                    ctx.arc(0, 0, coin.width / 2, 0, Math.PI * 2);
                    ctx.fill();

                    // Border
                    ctx.strokeStyle = '#FFA500';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();

                    // Center
                    ctx.fillStyle = '#FFA500';
                    ctx.beginPath();
                    ctx.arc(0, 0, 1.5, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.restore();
                }
            }
        }

        function drawBackground() {
            // Clouds
            ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
            for (let i = 0; i < 4; i++) {
                const cloudX = (gameState.level * 40 + i * 250) % canvas.width;
                const cloudY = 40 + i * 70;
                ctx.beginPath();
                ctx.arc(cloudX, cloudY, 25, 0, Math.PI * 2);
                ctx.arc(cloudX + 25, cloudY - 8, 35, 0, Math.PI * 2);
                ctx.arc(cloudX + 50, cloudY, 25, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function update() {
            if (gameState.gameOver) return;

            updatePlayer();
            updatePlatforms();
            updateEnemies();
            updateCoins();
            updateFireballs();
            updateParticles();
        }

        function draw() {
            // Clear
            ctx.fillStyle = 'rgba(135, 206, 235, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawBackground();
            drawPlatforms();
            drawCoins();
            drawEnemies();
            
            // Draw fireballs
            for (let fireball of fireballs) {
                fireball.draw(ctx);
            }

            drawPlayer();

            for (let particle of particles) {
                particle.draw(ctx);
            }

            // UI Updates
            document.getElementById('score').textContent = gameState.score;
            document.getElementById('level').textContent = gameState.level;
            document.getElementById('lives').textContent = gameState.lives;
            document.getElementById('coins').textContent = gameState.coinsCollected;
            document.getElementById('coinsTotal').textContent = gameState.coinsTotal;
            document.getElementById('bestScore').textContent = gameState.bestScore;
            document.getElementById('fireballs').textContent = gameState.fireballs;

            const progress = (gameState.level / 100) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('progressPercent').textContent = Math.floor(progress);

            if (gameState.gameOver) {
                const gameOverDiv = document.getElementById('gameOver');
                const gameOverText = document.getElementById('gameOverText');
                const gameOverStats = document.getElementById('gameOverStats');
                gameOverDiv.style.display = 'block';

                if (gameState.score > gameState.bestScore) {
                    gameState.bestScore = gameState.score;
                    localStorage.setItem('bestScore', gameState.bestScore);
                }

                if (gameState.won) {
                    gameOverText.textContent = '🎉 YOU WON! 🎉';
                    gameOverText.style.color = '#FFD700';
                    gameOverStats.innerHTML = `
                        <div>Completed All 100 Levels!</div>
                        <div style="font-size: 20px; margin-top: 10px; font-weight: bold;">Final Score: ${gameState.score}</div>
                        <div style="font-size: 14px; margin-top: 8px;">Best Score: ${gameState.bestScore}</div>
                    `;
                } else {
                    gameOverText.textContent = 'Game Over!';
                    gameOverText.style.color = '#FF6B6B';
                    gameOverStats.innerHTML = `
                        <div>Level Reached: ${gameState.level}/100</div>
                        <div style="font-size: 20px; margin-top: 10px; font-weight: bold;">Score: ${gameState.score}</div>
                        <div style="font-size: 14px; margin-top: 8px;">Best Score: ${gameState.bestScore}</div>
                    `;
                }
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Initialize
        generateLevel(1);
        gameLoop();
    </script>
</body>
</html>
